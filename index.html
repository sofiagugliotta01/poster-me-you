    <script type="module">
      import { animate } from "https://cdn.jsdelivr.net/npm/animejs@4.0.0/+esm";

      const rettangolo = document.querySelector("#rettangolo");
      const mePaths = document.querySelectorAll("#me path");
      const linea = document.querySelector("#linea");
      const usPath = document.querySelector("#us");

      const COLORS = ["#FFFFFF", "#FFA2A2"];
      const US_LENGTH = usPath.getTotalLength();

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function randomBackgroundColor() {
        const randomIndex = Math.floor(Math.random() * COLORS.length);
        return COLORS[randomIndex];
      }

      function applyPalette() {
        const bgColor = randomBackgroundColor();
        rettangolo.setAttribute("fill", bgColor);

        const meColor = bgColor === "#FFFFFF" ? "#FFA2A2" : "#FFFFFF";
        mePaths.forEach((path) => path.setAttribute("fill", meColor));
      }

      function resetCycleState() {
        linea.style.opacity = "0";
        linea.style.transform = "scaleX(0)";
        usPath.style.strokeDasharray = `${US_LENGTH}`;
        usPath.style.strokeDashoffset = `${US_LENGTH}`;
      }

      async function runLoop() {
        while (true) {
          applyPalette();
          resetCycleState();

          await animate("#linea", {
            scaleX: [0, 1],
            opacity: [0, 1],
            duration: 900,
            ease: "outCubic",
          }).finished;

          await animate("#us", {
            strokeDashoffset: [US_LENGTH, 0],
            duration: 1400,
            ease: "inOutSine",
          }).finished;

          await sleep(450);
        }
      }

      runLoop();
    </script>
